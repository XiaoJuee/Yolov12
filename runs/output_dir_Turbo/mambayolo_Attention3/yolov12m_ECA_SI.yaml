# YOLOv12 Optimized with Efficient Attention
# Parameters
nc: 18
scales:
  m: [0.50, 1.00, 512]

# Backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]    # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2, 1, 2]]   # 1-P2/4 (添加完整参数)
  - [-1, 2, C3k2, [256, False, 0.25]]         # 2 (保持原版三个参数)
  - [-1, 1, ECAAttention, [256]]    # 3-ECA @ P3
  - [-1, 1, Conv, [512, 3, 2, 1, 4]]   # 4-P3/8 (添加完整参数)
  
  - [-1, 4, A2C2f, [512, True, 4]]        # 5 (保持原版三个参数)
  - [-1, 1, SimAM, []]           # 6-SimAM @ P4
  
  - [-1, 1, Conv, [1024, 3, 2]]   # 7-P4/16
  - [-1, 4, A2C2f, [1024, True, 1]]       # 8 (保持原版三个参数)

# Head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 9
  - [[-1, 5], 1, Concat, [1]]                   # 10 cat b5(512) -> 1024+512
  - [-1, 2, A2C2f, [512, False, -1]]            # 11 (保持原版三个参数)
  - [-1, 1, CBAM, [512]]                        # 12-CBAM (添加通道参数)
  
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 13
  - [[-1, 3], 1, Concat, [1]]                   # 14 cat b3(256) -> 512+256
  - [-1, 2, A2C2f, [256, False, -1]]            # 15 (保持原版三个参数)
  
  - [-1, 1, Conv, [256, 3, 2]]                 # 16-P3/8
  - [[-1, 11], 1, Concat, [1]]                 # 17 cat head11(512) -> 256+512
  - [-1, 2, A2C2f, [512, False, -1]]            # 18 (保持原版三个参数)
  
  - [-1, 1, Conv, [512, 3, 2]]                 # 19-P4/16
  - [[-1, 8], 1, Concat, [1]]                  # 20 cat b8(1024) -> 512+1024
  - [-1, 2, C3k2, [1024, True]]                 # 21 (保持原版两个参数)
  
  - [[15, 18, 21], 1, Detect, [nc]]             # 22 Detect(P3/8, P4/16, P5/32)