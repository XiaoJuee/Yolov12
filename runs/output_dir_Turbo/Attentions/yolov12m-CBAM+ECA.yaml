# YOLOv12m-CBAM-MSCA 🚀
# 结合 CBAM（浅层空间-通道注意力）与 MSCAAttention（深层多尺度通道注意力）
# 预训练模型：yolov12m.pt
# 适用任务：目标检测（P3-P5 多尺度输出）

# Parameters
nc: 80  # 类别数 (COCO 标准)
scales:
  m: [0.50, 1.00, 512]  # depth, width, max_channels (yolov12m 参数)

# Backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]        # 0-P1/2  [c=64, s=2]
  - [-1, 1, Conv, [128, 3, 2]]       # 1-P2/4  [c=128, s=2]
  - [-1, 2, C3k2,  [256, False, 0.25]]            # 2       [c=256, shortcut=False, g=0.25]
  - [-1, 1, Conv, [256, 3, 2]]       # 3-P3/8  [c=256, s=2]
  - [-1, 2, C3k2,  [512, False, 0.25]]          # 4       [c=512, shortcut=False, g=0.25]
  - [-1, 1, Conv, [512, 3, 2]]       # 5-P4/16 [c=512, s=2]
  - [-1, 4, A2C2f, [512, True, 4]]   # 6       [c=512, use_area_attn=True, heads=4]
  - [-1, 1, CBAM, []]                # 7 👉 浅层添加 CBAM（空间+通道注意力）
  - [-1, 1, Conv, [1024, 3, 2]]      # 8-P5/32 [c=1024, s=2]
  - [-1, 4, A2C2f, [1024, True, 1]]  # 9       [c=1024, use_area_attn=True, heads=1]
  - [-1, 1, ECA, []]                 # 10 👉 替换为ECA通道注意力(轻量化)

# Head (保持不变，兼容原始检测层)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 11
  - [[-1, 6], 1, Concat, [1]]                   # 12 → 拼接 P4 (第6层)
  - [-1, 1, CBAM, []]                # 👉 新增
  - [-1, 2, A2C2f, [512, False, -1]]            # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 14
  - [[-1, 4], 1, Concat, [1]]                   # 15 → 拼接 P3 (第4层)
  - [-1, 2, A2C2f, [256, False, -1]]            # 16

  - [-1, 1, Conv, [256, 3, 2]]                  # 17-P4
  - [[-1, 13], 1, Concat, [1]]                  # 18 → 拼接 P4 (第13层)
  - [-1, 2, A2C2f, [512, False, -1]]            # 19

  - [-1, 1, Conv, [512, 3, 2]]                  # 20-P5
  - [[-1, 10], 1, Concat, [1]]                  # 21 → 拼接 P5 (第10层)
  - [-1, 2, C3k2, [1024, True]]                 # 22 (P5/32-large)

  - [[16, 19, 22], 1, Detect, [nc]]             # 23-Detect(P3, P4, P5)