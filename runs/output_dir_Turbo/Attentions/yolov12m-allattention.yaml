# YOLOv12m-HybridAttention 🚀, AGPL-3.0 license
# Optimized hybrid attention structure for YOLOv12m
# Enhanced with CoordAtt (position-aware), CBAM (spatial-channel), ECA (lightweight channel)

# Parameters
nc: 80  # number of classes (COCO)
scales:
  m: [0.50, 1.00, 512]  # depth, width, max_channels (yolov12m scale)

# Enhanced Backbone with Hybrid Attention
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]         # 0-P1/2 [ch=64, stride=2]
  - [-1, 1, Conv, [128, 3, 2]]        # 1-P2/4 [ch=128, stride=2]
  - [-1, 2, C3k2, [256, False, 0.25]] # 2 [ch=256, shortcut=False, g=0.25]
  
  # P3 Layer: Position-aware attention for spatial details
  - [-1, 1, Conv, [256, 3, 2]]        # 3-P3/8 [ch=256, stride=2]
  - [-1, 2, C3k2, [512, False, 0.25]] # 4 [ch=512, shortcut=False, g=0.25]
  - [-1, 1, CoordAtt, []]              # 5 👉 Position-aware attention (P3 level)
  
  - [-1, 1, Conv, [512, 3, 2]]        # 6-P4/16 [ch=512, stride=2]
  - [-1, 4, A2C2f, [512, True, 4]]    # 7 [ch=512, use_area_attn=True, heads=4]
  
  # P4 Layer: Spatial-channel attention for mid-level features
  - [-1, 1, CBAM, []]                 # 8 👉 Spatial-channel attention (P4 level)
  
  - [-1, 1, Conv, [1024, 3, 2]]       # 9-P5/32 [ch=1024, stride=2]
  - [-1, 4, A2C2f, [1024, True, 1]]   # 10 [ch=1024, use_area_attn=True, heads=1]
  
  # P5 Layer: Lightweight channel attention for semantic features
  - [-1, 1, ECA, []]                  # 11 👉 Lightweight channel attention (P5 level)

# Enhanced Head with Attention Refinement
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 12
  - [[-1, 7], 1, Concat, [1]]                  # 13 → concat P4 (layer 7)
  - [-1, 2, A2C2f, [512, False, -1]]            # 14
  
  # P4 Feature Refinement
  - [-1, 1, CBAM, []]                  # 15 👉 Spatial refinement for P4
  
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 16
  - [[-1, 5], 1, Concat, [1]]                  # 17 → concat P3 (layer 5)
  - [-1, 2, A2C2f, [256, False, -1]]            # 18
  
  # P3 Feature Refinement
  - [-1, 1, CoordAtt, []]              # 19 👉 Position refinement for P3
  
  - [-1, 1, Conv, [256, 3, 2]]        # 20-P4 [ch=256, stride=2]
  - [[-1, 15], 1, Concat, [1]]        # 21 → concat P4 (layer 15)
  - [-1, 2, A2C2f, [512, False, -1]]   # 22
  
  - [-1, 1, Conv, [512, 3, 2]]        # 23-P5 [ch=512, stride=2]
  - [[-1, 11], 1, Concat, [1]]        # 24 → concat P5 (layer 11)
  - [-1, 2, C3k2, [1024, True]]       # 25 (P5/32-large)
  
  # Output layers with attention-enhanced features
  - [[19, 22, 25], 1, Detect, [nc]]   # 26-Detect(P3, P4, P5)