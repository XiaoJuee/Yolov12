# YOLOv12m_Turbo with SE_block (基于官方 Turbo 架构修改)[2,6](@ref)

# YOLOv12 🚀, AGPL-3.0 license
# YOLOv12 object detection model with P3-P5 outputs. For Usage examples see https://docs.ultralytics.com/tasks/detect
# CFG file for YOLOv12-turbo
 
# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov12n.yaml' will call yolov12.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 497 layers, 2,553,904 parameters, 2,553,888 gradients, 6.2 GFLOPs
  s: [0.50, 0.50, 1024] # summary: 497 layers, 9,127,424 parameters, 9,127,408 gradients, 19.7 GFLOPs
  m: [0.50, 1.00, 512] # summary: 533 layers, 19,670,784 parameters, 19,670,768 gradients, 60.4 GFLOPs
  l: [1.00, 1.00, 512] # summary: 895 layers, 26,506,496 parameters, 26,506,480 gradients, 83.3 GFLOPs
  x: [1.00, 1.50, 512] # summary: 895 layers, 59,414,176 parameters, 59,414,160 gradients, 185.9 GFLOPs

# YOLOv12m_Turbo with SE_block (兼容官方结构)

# YOLOv12m_Turbo with SE_block（根治尺寸冲突版）



# --------------------- 骨干网络 (Backbone) ---------------------
backbone:
  - [-1, 1, Conv, [64, 3, 2]]                     # 0-P1/2 [B,64,H/2,W/2]
  - [-1, 1, Conv, [128, 3, 2]]                    # 1-P2/4 [B,128,H/4,W/4]
  - [-1, 2, C3k2, [256, False, 0.25]]             # 2 [B,256,H/4,W/4]
  - [-1, 1, Conv, [256, 3, 2]]                    # 3-P3/8 [B,256,H/8,W/8]
  - [-1, 2, C3k2, [512, False, 0.25]]             # 4 [B,512,H/8,W/8]
  - [-1, 1, Conv, [512, 3, 2]]                    # 5-P4/16 [B,512,H/16,W/16] ✅ 关键锚点层
  - [-1, 4, A2C2f, [512, True, 1, 4]]             # 6 [B,512,H/16,W/16] 
  - [-1, 1, SE_block, [512, 16]]                  # 7 [B,512,H/16,W/16]（输入通道需显式指定）[1](@ref)
  - [-1, 1, Conv, [1024, 3, 2]]                   # 8-P5/32 [B,1024,H/32,W/32]
  - [-1, 1, SE_block, [1024, 8]]                  # 9 [B,1024,H/32,W/32]
  - [-1, 4, A2C2f, [1024, True, 1, 1]]            # 10 [B,1024,H/32,W/32]

# --------------------- 头部网络 (Head) ---------------------
head:
  # --- 上采样路径 ---
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 11: 上采样10→ [B,1024,H/16,W/16]
  - [-1, 1, Conv, [512, 1, 1]]                    # 12: 通道对齐 [B,512,H/16,W/16] 🔥 新增卷积解决通道数翻倍
  - [[-1, 5], 1, Concat, [1]]                     # 13: 拼接第12层和第5层 → [B,512+512=1024,H/16,W/16]
  
  # --- 多尺度融合 ---
  - [-1, 2, A2C2f, [512, False, 1, 8]]            # 14 [B,512,H/16,W/16]（缩放因子必须>0）
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]    # 15: 上采样→ [B,512,H/8,W/8]
  - [[-1, 4], 1, Concat, [1]]                     # 16: 拼接第15层和第4层 → [B,512+512=1024,H/8,W/8]
  - [-1, 2, A2C2f, [256, False, 1, 8]]            # 17 [B,256,H/8,W/8]
  
  # --- 下采样路径 ---
  - [-1, 1, Conv, [256, 3, 2]]                    # 18 [B,256,H/16,W/16]
  - [[-1, 14], 1, Concat, [1]]                    # 19: 拼接第18层和第14层 → [B,256+512=768,H/16,W/16]
  - [-1, 2, A2C2f, [512, False, 1, 4]]            # 20 [B,512,H/16,W/16]
  - [-1, 1, Conv, [512, 3, 2]]                    # 21 [B,512,H/32,W/32]
  - [[-1, 10], 1, Concat, [1]]                    # 22: 拼接第21层和第10层 → [B,512+1024=1536,H/32,W/32]
  - [-1, 2, C3k2, [1024, True]]                   # 23 [B,1024,H/32,W/32]
  
  # --- 检测头 ---
  - [[17, 20, 23], 1, Detect, [nc]]               # 24: 输入P3(17), P4(20), P5(23)