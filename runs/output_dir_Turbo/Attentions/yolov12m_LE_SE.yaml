# YOLOv12 🚀 with SENet+LEGM Attention, AGPL-3.0 license
# Modified by [Your Name] on 2025-07-11

# Parameters
nc: 18  # 根据您的数据集调整为18类[4](@ref)
scales:
  m: [0.50, 1.00, 512]  # 保持原始缩放比例

# Backbone with Attention Modules
backbone:
  # 在第一个卷积前添加SENet (输入通道=3)
  - [-1, 1, SE_block, []]  # 0: 使用默认参数(scaling=16, inplace=True)
  
  # 原始卷积层 (保持结构)
  - [-1, 1, Conv,  [64, 3, 2]]   # 1-P1/2
  - [-1, 1, Conv,  [128, 3, 2, 1, 2]]  # 2-P2/4
  - [-1, 2, C3k2,  [256, False, 0.25]]  # 3
  - [-1, 1, Conv,  [256, 3, 2, 1, 4]]  # 4-P3/8
  - [-1, 2, C3k2,  [512, False, 0.25]]  # 5
  
  # 在P4/16后添加LEGM (输入通道=512)
  - [-1, 1, Conv,  [512, 3, 2]]  # 6-P4/16
  - [-1, 4, A2C2f, [512, True, 4]]  # 7
  - [-1, 1, LEGM, [512]]  # 8: 使用默认参数(window_size=8, shift_size=4)

  # 后续原始层
  - [-1, 1, Conv,  [1024, 3, 2]]  # 9-P5/32
  - [-1, 4, A2C2f, [1024, True, 1]]  # 10

# Head (根据Backbone变化调整索引)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 11
  - [[-1, 7], 1, Concat, [1]]  # 12: 连接LEGM前的特征(索引7)
  - [-1, 2, A2C2f, [512, False, -1]]  # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 14
  - [[-1, 4], 1, Concat, [1]]  # 15: 连接P3(索引4)
  - [-1, 2, A2C2f, [256, False, -1]]  # 16

  - [-1, 1, Conv, [256, 3, 2]]  # 17
  - [[-1, 13], 1, Concat, [1]]  # 18: 连接P4(索引13)
  - [-1, 2, A2C2f, [512, False, -1]]  # 19

  - [-1, 1, Conv, [512, 3, 2]]  # 20
  - [[-1, 10], 1, Concat, [1]]  # 21: 连接P5(索引10)
  - [-1, 2, C3k2, [1024, True]]  # 22

  # 检测头 (匹配三个特征层级)
  - [[16, 19, 22], 1, Detect, [nc]]  # Detect(P3, P4, P5)