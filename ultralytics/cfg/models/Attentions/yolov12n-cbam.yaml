# YOLOv12 with CBAM Attention
# Integrated at Backbone end, Neck outputs, and Head

# 参数
nc: 18  # 类别数
scales:  #  必须顶格写，冒号后空格
  n: [0.50, 0.25, 1024]  #  两个空格缩进
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# -------------------- Backbone --------------------
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]             # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]            # 1-P2/4
  - [-1, 2, A2C2f, [256]]                 # 2 (Area Attention)
  - [-1, 1, Conv, [256, 3, 2]]            # 3-P3/8
  - [-1, 2, A2C2f, [512]]                 # 4
  - [-1, 1, Conv, [512, 3, 2]]            # 5-P4/16
  - [-1, 4, A2C2f, [512]]                 # 6
  - [-1, 1, Conv, [1024, 3, 2]]           # 7-P5/32
  - [-1, 4, A2C2f, [1024]]                # 8
  - [-1, 1, SPPF, [1024, 5]]              # 9
  - [-1, 1, CBAM, []]                     # 10 🟢 CBAM at Backbone end [6,8](@ref)

# -------------------- Neck --------------------
neck:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 11
  - [[-1, 6], 1, Concat, [1]]             # 12 (P4)
  - [-1, 2, A2C2f, [512]]                 # 13
  - [-1, 1, CBAM, []]                     # 14 🟢 CBAM for P4 [8](@ref)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 15
  - [[-1, 4], 1, Concat, [1]]             # 16 (P3)
  - [-1, 2, A2C2f, [256]]                 # 17
  - [-1, 1, CBAM, []]                     # 18 🟢 CBAM for P3 [6](@ref)

  - [-1, 1, Conv, [256, 3, 2]]            # 19
  - [[-1, 14], 1, Concat, [1]]            # 20 (P4)
  - [-1, 2, A2C2f, [512]]                 # 21
  - [-1, 1, CBAM, []]                     # 22 🟢 CBAM for P4 (2nd) [6](@ref)

  - [-1, 1, Conv, [512, 3, 2]]            # 23
  - [[-1, 10], 1, Concat, [1]]            # 24 (P5)
  - [-1, 2, A2C2f, [1024]]                # 25
  - [-1, 1, CBAM, []]                     # 26 🟢 CBAM for P5 [8](@ref)

# -------------------- Head --------------------
head:
  - [-1, 1, CBAM, []]                     # 27 🟢 Final CBAM before Detect [8](@ref)
  - [[18, 22, 27], 1, Detect, [nc]]       # 28 Detect(P3, P4, P5) [1](@ref)